name: Build Go compiler
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
    - name: Prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y binfmt-support qemu-user-static
    - name: Compile Go with all.bash
      run: |
        cd src ; ./all.bash
    - name: Run Go distribution tests under tamago/riscv64
      run: |
        GO_BUILDER_NAME=tamago GOOS=tamago GOARCH=riscv64 ./bin/go tool dist test
    - name: Run Go distribution tests under tamago/riscv64 GOSOFT=1
      run: |
        ./bin/go clean -cache
        GO_BUILDER_NAME=tamago GOOS=tamago GOARCH=riscv64 GOSOFT=1 QEMU_CPU=rv64,a=off,d=off,h=off,s=on,u=on,zawrs=off ./bin/go tool dist test
